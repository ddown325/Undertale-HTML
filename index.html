      #utLoader {
        position: fixed; inset: 0; z-index: 9999;
        background: #000;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      #utLoader.hide { display: none; }
      #utLoader svg { display: block; }
      #utPct {
        margin-top: 34px;
        font-family: 'Press Start 2P', monospace;
        font-size: 18px; color: #fff;
        letter-spacing: 0.06em;
      }
      #utStage {
        margin-top: 18px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px; color: #6e6e6e;
        letter-spacing: 0.28em; text-transform: uppercase;
        min-height: 10px;
      }
      #utStage.err { color: #ff0000; letter-spacing: 0.14em; }
      #utLoader.done #utHeartFill { animation: utFlash 0.32s steps(2, jump-none) 1; }
      @keyframes utFlash { 0% { fill: #fff; } 100% { fill: #ff0000; } }
      #utWarn {
        position: absolute; top: 14px; left: 0; right: 0;

    /* [ut-gamestorage-inline] ====================================================

       The runner picks its savedata file system ONCE, at mount time:

         window.oprt && window.oprt.gameStorage ? GXMFS : IDBFS   (runner.js)

       and its syncfs dispatcher skips any mount without a .zk method -
       IDBFS has none, so on a plain web host an IDBFS mount means the
       save system silently no-ops (nothing loads, nothing persists).

       Before v1.5 the polyfill below lived only in index.js, which is
       appended as a dynamic <script> TOGETHER with runner.js - two async
       scripts racing. Whenever the runner reached its mount first, every
       save was lost: boot showed the name-picking flow again, boss states
       vanished, "saves are deleted constantly". Installing the polyfill
       here, synchronously during page parse - long before the loader
       appends any dynamic script - makes GXMFS win every time.

       line of defense for exotic embeds. Do not remove either.

          };

             fixed-version open fails with VersionError forever and the game
             can neither load nor save. Fall back to a version-less open,
             which always succeeds and never upgrades anything. */

            if (req.error && req.error.name === "VersionError") {
              var req2;
              try { req2 = indexedDB.open("/_savedata"); }
              catch (e2) { reject(e2); return; }

         read garbage from it and write garbage back - forever. Numeric-key

        return { timestamp: new Date(), mode: 33206, contents: value };

         map ( { "file0": "<549 lines>", "file9": ...,
         "undertale.ini": ... } ). scr_load reads file0 line-by-line with
         exactly 549 readlns, and any ossafe_file_text_* call on a file
         that failed to open is a FATAL GameMaker exception (crash.log:
         "File is not opened for reading" -> the runner re-inits, the
         player loses the session). Old cloud-synced / pre-v1.7 maps can

      }

             else synthesize a fresh LV1 file so the game boots instead of
             throwing the fatal "File is not opened for reading" */
          var rec = null, mir = null;
          try { rec = window.oprt.__utGetFSFile && window.oprt.__utGetFSFile("file0"); } catch (e0) {}

          var cand = rec || mir;
          f0 = __utFixFile0(cand);
          if (f0 === null) {

            for (var z = 1; z < 549; z++) f0 += (z === 547 ? "5" : "0") + "\n";
          }

        if (map["file0"] !== f0) { map["file0"] = f0; changed = true; }
        /* file9 - the temp save: same 549-line format, heal the same way */
        if (map["file9"] !== undefined && map["file9"] !== null) {
          var f9 = __utFixFile0(map["file9"]);
          if (f9 === null) { delete map["file9"]; changed = true; }
          else if (map["file9"] !== f9) { map["file9"] = f9; changed = true; }
        }
        /* undertale.ini - scr_gameoverb / obj_titleimage open + write it;
           a missing one is the same fatal class */

          try { iniRec = window.oprt.__utGetFSFile && window.oprt.__utGetFSFile("undertale.ini"); } catch (e2) {}

        }

        var out = JSON.stringify(map) + "\u0000";
        var healed = { timestamp: new Date(), mode: 33206, contents: new TextEncoder().encode(out) };
        try { console.log("[ut-heal] repaired undertale.sav" + (dead ? " (unparseable JSON - rebuilt)" : "")); } catch (e4) {}

      }

         function") on every reconcile. Normalize them once per session;
         content is preserved byte-for-byte. */

              var st = t.objectStore("FILE_DATA");

              var cur = st.openCursor();

                var c = e.target.result;
                if (!c) { if (fixed) console.log("[ut-heal] normalized " + fixed + " legacy record timestamp(s)"); db.close(); resolve(); return; }

                  var st = t.objectStore("FILE_DATA");

                                  (n && n.timestamp ? new Date(n.timestamp) : new Date(0)),
                      mode: n ? n.mode : 33206
                    };

                  };

                } catch (e) { resolve({}); db.close(); }
              }, function () { resolve({}); });
            });
          }

            list: function () {
              if (window.__gsTrace.length > 400) window.__gsTrace.splice(0, 200);
              window.__gsTrace.push("list:" + name); return listAll();
            },
            get: function (key) {

              window.__gsTrace.push("get:" + name + "/" + key);

                 deleting them. */

    <script>
    (function () {

      /* ==========================================================
       *  HARDER SANS (session roll, 1 in 3)
       *  ----------------------------------------------------------
       *  One roll per page load. If it hits, every Sans fight this
       *  session plays mus_zz_megalovania_alternate.ogg instead of
       *  Megalovania (VFS swap in main()). Session-scoped on purpose:
       *  the runner decodes each sound index once and caches it for
       *  the life of the page, so a per-fight swap would desync.
       *  (v2.0: the old hardmode.flag damage write is gone - that
       *  game-data hook never worked in any shipped version and its
       *  bytecode scaffolding is what crashed the Sans trigger. The
       *  alternate track is the feature.)
       *  (index.js carries a guarded copy of the roll for exotic
       *  embeds that load it standalone - e.g. the offline build.)
       * ========================================================== */

      window.__utHardSans = UT_HARD_SANS;

       *  v1.9 - BOSS STATE PENDING WRITE (the "state did not take" fix)
       *  ----------------------------------------------------------

       *  was still live; the dying page's teardown syncfs could then
       *  flush the OLD in-memory savedata back over the fresh records,
       *  so the next boot continued the PREVIOUS save instead of the
       *  boss you picked. index.js now only BUILDS the state (file0 /
       *  undertale.ini / the merged undertale.sav map) and stashes the
       *  three finished texts in sessionStorage; this module writes
       *  them here, at page parse - before the runner even exists, so
       *  nothing can race or clobber them, and the runner mounts the
       *  new state directly.
       * ========================================================== */

        var raw = null;
        try { raw = sessionStorage.getItem('utBossWrite'); } catch (e) { return; }
        if (!raw) return;
        try { sessionStorage.removeItem('utBossWrite'); } catch (e2) {}

        try { p = JSON.parse(raw); } catch (e3) { return; }

           up to 10 s - not good enough right after a state switch) */

                               contents: enc(text) }, key);
          };

            put('/_savedata/undertale.sav', p.sav + '\u0000'),
            put('/_savedata/file0', p.file0),
            put('/_savedata/undertale.ini', p.ini)
          ]).then(function () {
            mirror('undertale.sav', p.sav + '\u0000');
            mirror('file0', p.file0);
            mirror('undertale.ini', p.ini);
            console.log('[UTBossStates] wrote ' + (p.label || 'boss') +
                        ' state at boot (undertale.sav + file0/ini) - CONTINUE starts at the boss');
          }, function (err) {
            console.log('[UTBossStates] pending boss state write FAILED:', err);
          });
        }
      })();

      /* ==========================================================
       *  CONFIG - bump CACHE_VERSION whenever you update any game
       *  file (game.unx parts, runner.*, lang/*) so every visitor
       *  re-downloads instead of using their stale offline copy.
       * ========================================================== */
      var CACHE_VERSION = 'v2.6';
      var CACHE_NAME = 'undertale-html-' + CACHE_VERSION;

      /* exact byte sizes - used for progress when a response has no
       * Content-Length, and to detect stale cached copies */
      var SIZES = {
        'game.unx.part1': 19993648,
        'game.unx.part2': 19993648,
        'game.unx.part3': 19993648,
        'game.unx.part4': 19993648,
        'game.unx.part5': 19997108,
        'runner.wasm': 5645898,
        'runner.data': 12561615,
        'audio-worklet.js': 491
      };
      var PARTS = ['game.unx.part1', 'game.unx.part2', 'game.unx.part3', 'game.unx.part4', 'game.unx.part5'];
      var RUNTIME = ['runner.wasm', 'runner.data', 'audio-worklet.js'];
      /* v2.3: lang/*.json are reference mirrors of the text compiled into
         game.unx - the game itself never reads them (scr_gettext reads the
         in-data ds_maps), so they no longer block the boot. They are
         fetched in the background after the game starts, purely to keep
         the offline cache complete; the VFS serves a valid empty stub. */
      var LAZY = ['lang/lang_en.json', 'lang/lang_ja.json'];
      /* v2.0: computed from SIZES so the progress bar can never drift out
         of sync with a shard resize again */
      var TOTAL_BYTES = 0;
      for (var sz in SIZES) TOTAL_BYTES += SIZES[sz];

      var el = {
        loader: document.getElementById('utLoader'),
        warn: document.getElementById('utWarn'),
        stage: document.getElementById('utStage'),
        pct: document.getElementById('utPct'),
        heartFill: document.getElementById('utHeartFill'),
        retry: document.getElementById('utRetry'),
        status: document.getElementById('status')
      };

      /* ---------------- progress ---------------- */
      var received = {};    /* file -> bytes confirmed */

      function totalReceived() {
        var t = 0;
        for (var k in received) t += received[k];
        return t;
      }

      var complete = false;

      function updateUI(stageText) {
        var done = totalReceived();
        var frac = Math.max(0, Math.min(1, done / TOTAL_BYTES));
        el.heartFill.setAttribute('y', String(10 - 10 * frac));
        el.pct.textContent = Math.floor(frac * 100) + '%';
        if (frac >= 0.999 && !complete) {
          complete = true;
          el.loader.classList.add('done');
        }
        if (stageText) el.stage.textContent = stageText;
      }
      updateUI();

      function fail(msg) {
        el.stage.textContent = msg;
        el.stage.classList.add('err');
        el.retry.hidden = false;
      }
      el.retry.addEventListener('click', function () { location.reload(); });

      /* ---------------- fetch one file (cache -> network w/ progress -> cache) ---------------- */
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function readWithProgress(resp, name, onBytes) {
        if (!resp.body || typeof resp.body.getReader !== 'function') {
          return resp.arrayBuffer().then(function (buf) {
            onBytes(buf.byteLength);
            return buf;
          });
        }
        var reader = resp.body.getReader();
        var chunks = [], got = 0;
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) {
              var out = new Uint8Array(got), o = 0;
              for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
              return out.buffer;
            }
            chunks.push(r.value);
            got += r.value.length;
            onBytes(got);
            return pump();
          });
        }
        return pump();
      }

      async function fetchFile(name, attempt) {
        attempt = attempt || 0;
        var url = new URL(name, document.baseURI).href;

        /* 1. page-level Cache API read (works even before the SW controls us).
           v2.4: read ONLY from THIS version's cache. A bare caches.match()
           searches every cache on the origin and can hand back a part from
           an old deploy's cache (same byte size, different content) - the
           runner then boots a frankenstein data file and dies with no error
           the page can catch. Old caches are purged at parse time below, so
           scoping the read here makes a wrong-version serve impossible. */
        try {
          var verCache = await caches.open(CACHE_NAME);
          var hit = await verCache.match(url);
          if (hit) {
            var cl = +(hit.headers.get('Content-Length') || 0);
            var expected = SIZES[name] || 0;
            if (!expected || !cl || cl === expected) {
              var buf = await hit.arrayBuffer();
              received[name] = buf.byteLength;
              updateUI();
              return new Uint8Array(buf);
            }
            /* stale size -> fall through and re-download */
          }
        } catch (e) { /* storage unavailable - just stream */ }

        /* 2. network download with live progress */
        try {
          var resp = await fetch(url, { cache: 'default', credentials: 'same-origin' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status + ' for ' + name);
          var cloneForCache = null;
          try { cloneForCache = resp.clone(); } catch (e) {}
          var data = new Uint8Array(await readWithProgress(resp, name, function (n) {
            received[name] = n;
            updateUI();
          }));
          /* 3. store for instant + offline repeat visits */
          if (cloneForCache) {
            try {
              var cache = await caches.open(CACHE_NAME);
              await cache.put(url, cloneForCache);
            } catch (e) { /* private mode etc. - fine */ }
          }
          return data;
        } catch (err) {
          if (attempt < 2) {
            console.warn('[loader] retrying', name, err && err.message);
            await sleep(700 * (attempt + 1));
            return fetchFile(name, attempt + 1);
          }
          throw err;
        }
      }

      /* ---------------- merge the game data ---------------- */
      function mergeParts(buffers) {
        var total = 0, i;
        for (i = 0; i < buffers.length; i++) total += buffers[i].length;
        var merged = new Uint8Array(total), off = 0;
        for (i = 0; i < buffers.length; i++) { merged.set(buffers[i], off); off += buffers[i].length; }
        return merged;
      }

      /* ---------------- runner boot ---------------- */
      var VFS = {}; /* filename -> blob URL served to the GameMaker runtime */

      function installInterceptors() {
        var swap = function (url) {
          if (typeof url !== 'string') return url;
          for (var name in VFS) {
            if (url.indexOf(name) >= 0) return VFS[name];
          }
          return url;
        };
        var originalFetch = window.fetch;
        window.fetch = async function () {
          var a = arguments;
          if (typeof a[0] === 'string') {
            return originalFetch.call(this, swap(a[0]), a[1]);
          }
          if (a[0] && a[0] instanceof Request) {
            var swapped = swap(a[0].url);
            if (swapped !== a[0].url) return originalFetch.call(this, new Request(swapped, a[0]), a[1]);
          }
          return originalFetch.apply(this, a);
        };
        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          var rest = Array.prototype.slice.call(arguments, 2);
          return originalOpen.apply(this, [method, swap(url)].concat(rest));
        };
        /* audio worklet module is fetched by URL too */
        if (window.AudioWorklet && AudioWorklet.prototype) {
          var origAddModule = AudioWorklet.prototype.addModule;
          AudioWorklet.prototype.addModule = function (url, opts) {
            return origAddModule.call(this, swap(url), opts);
          };
        }
      }

      /* clean the GameMaker loader's raw status strings for the stage line */
      var STAGE_MAP = [
        [/download/i, 'LOADING ENGINE'],
        [/compil/i, 'LOADING ENGINE'],
        [/initialis|initializ/i, 'STARTING GAME'],
        [/prepare/i, 'STARTING GAME'],
        [/start|run/i, 'STARTING GAME']
      ];
      function translateGM(t) {
        t = String(t).replace(/[\s.]*\d+%\s*$/, '').replace(/\.+$/, '').trim();
        for (var i = 0; i < STAGE_MAP.length; i++) {
          if (STAGE_MAP[i][0].test(t)) return STAGE_MAP[i][1];
        }
        return t.toUpperCase().slice(0, 24);
      }

      function startRunnerScripts() {
        /* mirror the hidden GameMaker status into the stage line while it boots */
        var mirror = setInterval(function () {
          var t = el.status && el.status.textContent ? el.status.textContent.trim() : '';
          if (t) el.stage.textContent = translateGM(t);
        }, 300);

        var hide = function () {
          if (el.loader.classList.contains('hide')) return;
          clearInterval(mirror);
          el.loader.classList.add('hide');
        };
        /* hide as soon as the game prints its first frame */
        var origLog = console.log.bind(console);
        console.log = function (t) {
          if (typeof t === 'string' && t.indexOf('Entering main loop') >= 0) {
            console.log = origLog;
            hide();
          }
          origLog.apply(console, arguments);
        };
        /* belt and braces: the canvas gets .active at the same moment */
        var poll = setInterval(function () {
          if (document.getElementById('canvas').classList.contains('active')) {
            clearInterval(poll); hide();
          }
        }, 500);

        el.stage.textContent = 'STARTING GAME';
        updateUI('STARTING GAME');
        el.pct.textContent = '100%';

        armBootWatchdog();
        /* the watchdog ticket is only valid until the game actually runs */
        var wdClear = setInterval(function () {
          if (!window.UT_BOOTED) return;
          try { sessionStorage.removeItem('utBootWatchdog'); } catch (e) {}
          clearInterval(wdClear);
        }, 1000);

        /* v2.5: STRICT ORDER - index.js MUST finish loading before runner.js is
           even appended. Both scripts are dynamic (async by default), so they
           used to execute in whatever order they arrived. On a reload the
           service worker serves runner.js cache-first (instant) while index.js
           is network-first (100-500ms on a real host), so runner.js executed
           FIRST and blew up with "manifestFiles is not defined" (the function
           lives in index.js; the runner calls it during its boot, right after
           the savedata mount). The engine then died silently - the exact
           "after a first load the engine fails to load, hard reload fixes it"
           bug. Chaining the appends restores the template's original order
           no matter which one the network delivers first. */
        var s1 = document.createElement('script');
        s1.src = 'index.js';
        s1.onerror = function () { fail('COULD NOT LOAD INDEX.JS'); };
        s1.onload = function () {
          var s2 = document.createElement('script');
          s2.src = 'runner.js';
          s2.onerror = function () { fail('COULD NOT LOAD RUNNER.JS'); };
          document.body.appendChild(s2);
        };
        document.body.appendChild(s1);
      }

      /* ---------------- service worker (oggs + offline shell) ---------------- */
      function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          /* v1.6: ask for an update check on every visit - the browser's own
             24 h throttle made new deploys take up to a day to reach players */
          try { if (reg.update) reg.update().catch(function () {}); } catch (e) {}
        }).catch(function (e) {
          console.warn('[loader] service worker unavailable:', e);
        });
      }

      /* ---------------- v2.4 boot hardening ---------------- */
      /* (a) purge foreign/old caches NOW, at page parse - BEFORE any part is
         fetched. Previously this happened only after the boot finished, so a
         stale cache from an older deploy could serve wrong-but-same-sized
         parts during the very boot that was supposed to clean it up. */
      (function purgeForeignCaches() {
        if (!window.caches || !caches.keys) return;
        caches.keys().then(function (names) {
          names.forEach(function (nm) {
            if (nm !== CACHE_NAME) {
              console.warn('[loader] purging stale cache:', nm);
              caches.delete(nm).catch(function () {});
            }
          });
        }).catch(function () {});
      })();

      /* (b) boot watchdog: if the runner has not entered its main loop within
         45 s of the boot scripts starting, something died silently (the
         runner aborts on some wasm-level faults without ever throwing a JS
         error the page can see). Recover once per session: purge every cache,
         unregister the service worker and reload - equivalent to the "hard
         reload" players had to do by hand. */
      function armBootWatchdog() {
        var armed = false;
        try { armed = sessionStorage.getItem('utBootWatchdog') === '1'; } catch (e) {}
        if (armed) {
          console.warn('[loader] boot watchdog already fired this session - showing the retry button');
          setTimeout(function () { fail('THE GAME DID NOT START'); }, 45000);
          return;
        }
        setTimeout(function () {
          if (window.UT_BOOTED) return;
          try { sessionStorage.setItem('utBootWatchdog', '1'); } catch (e) {}
          console.warn('[loader] boot watchdog fired - purging caches and reloading once');
          var go = function () { window.location.replace(window.location.pathname + '?utwatch=1' + window.location.hash); };
          var left = 0;
          function done() { if (--left <= 0) go(); }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            left++;
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var q = regs.length;
              if (!q) return done();
              regs.forEach(function (rg) {
                rg.unregister().then(function () { if (--q <= 0) done(); },
                                      function () { if (--q <= 0) done(); });
              });
            }).catch(done);
          }
          if (window.caches && caches.keys) {
            left++;
            caches.keys().then(function (names) {
              var q = names.length;
              if (!q) return done();
              names.forEach(function (nm) {
                caches.delete(nm).then(function () { if (--q <= 0) done(); },
                                       function () { if (--q <= 0) done(); });
              });
            }).catch(done);
          }
          setTimeout(go, 4000);   /* never hang on a stuck promise */
        }, 45000);
      }

      /* ---------------- main ---------------- */
      async function main() {
        registerSW();
        /* v2.3: prefetch the boot scripts in parallel with the 100 MB of
         * game data - index.js revalidates cheaply (network-first in the
         * SW) and runner.js lands in the SW cache before the boot needs
         * it. Failures are ignored; the normal script tags still work. */
        ['index.js', 'runner.js'].forEach(function (n) {
          fetch(n).catch(function () {});
        });
        try {
          /* all downloads in parallel - progress is byte-exact across them */
          var names = PARTS.concat(RUNTIME);
          updateUI('LOADING GAME DATA');
          var results = {};
          var jobs = names.map(function (n) {
            return fetchFile(n).then(function (data) { results[n] = data; });
          });
          await Promise.all(jobs);

          var gameData = mergeParts(PARTS.map(function (p) { return results[p]; }));

          /* build the in-memory file system the runtime will be pointed at */
          VFS['game.unx'] = URL.createObjectURL(new Blob([gameData]));
          VFS['runner.wasm'] = URL.createObjectURL(new Blob([results['runner.wasm']], { type: 'application/wasm' }));
          VFS['runner.data'] = URL.createObjectURL(new Blob([results['runner.data']], { type: 'application/octet-stream' }));
          VFS['audio-worklet.js'] = URL.createObjectURL(new Blob([results['audio-worklet.js']], { type: 'text/javascript' }));
          /* v2.3: stub the lang mirrors (nothing in the game reads them);
             the real files are background-fetched below for the offline
             cache and swapped in when they arrive. */
          VFS['lang_en.json'] = URL.createObjectURL(new Blob(['{}'], { type: 'application/json' }));
          VFS['lang_ja.json'] = URL.createObjectURL(new Blob(['{}'], { type: 'application/json' }));
          var langLoaded = false;
          var swapLang = function () {
            if (langLoaded) return;
            langLoaded = true;
            LAZY.forEach(function (n) {
              fetch(n).then(function (r) {
                if (!r.ok) return;
                return r.arrayBuffer().then(function (buf) {
                  var key = n.indexOf('_ja') >= 0 ? 'lang_ja.json' : 'lang_en.json';
                  VFS[key] = URL.createObjectURL(new Blob([buf], { type: 'application/json' }));
                });
              }).catch(function () {});
            });
          };

          /* v1.8 - HARDER SANS: on the winning roll, load the alternate
           * megalovania now and serve it whenever the runner asks for the
           * original - the swap is a plain VFS entry, so nothing in the
           * runner or the SW has to change. Only hard-mode sessions pay
           * the extra ~3 MB download; the file is cached like the rest. */
          if (window.__utHardSans) {
            try {
              var alt = await fetchFile('mus_zz_megalovania_alternate.ogg');
              VFS['mus_zz_megalovania.ogg'] = URL.createObjectURL(
                new Blob([alt], { type: 'audio/ogg' }));
            } catch (e) {
              /* alternate unavailable - the fight just uses the normal
               * Megalovania; nothing else was conditioned on the roll. */
              console.warn('[loader] harder-sans track unavailable:', e && e.message);
            }
          }

          /* clean caches from older versions once we're done with them */
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { if (k !== CACHE_NAME) caches.delete(k); });
          }).catch(function () {});

          installInterceptors();
          startRunnerScripts();

          /* v2.3: with the game running, finish the offline cache in the
           * background - the SW stores the lang mirrors so offline boots
           * have the same file set as before. */
          setTimeout(swapLang, 3000);
        } catch (err) {
          console.error(err);
          fail('DOWNLOAD FAILED');
          el.warn.hidden = false;
          el.warn.textContent = 'CHECK YOUR CONNECTION, THEN RETRY.';
        }
      }

      window.addEventListener('error', function () {
        if (!el.loader.classList.contains('hide') && el.retry.hidden) {
          el.warn.hidden = false;
          el.warn.textContent = 'SOMETHING WENT WRONG - DETAILS IN THE CONSOLE (F12).';
        }
      });

      if ('storage' in navigator && navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(function (est) {
          /* ~250 MB headroom needed for the game + cache; warn early if clearly impossible */
          if (est.quota && est.quota < 250 * 1048576) {
            el.warn.hidden = false;
            el.warn.textContent = 'BROWSER STORAGE IS LOW - THE OFFLINE CACHE MAY NOT FIT.';
          }
        }).catch(function () {});
      }

      main();
    })();
    </script>
  </body>
</html>
