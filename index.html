    <style>
      html { background: #000; }
      body {
        margin: 0; padding: 0;
        min-height: 100vh; min-height: 100dvh;
        min-width: 100vw;
        background: #000;
        font-family: "Courier New", "Lucida Console", Monaco, monospace;
        display: flex; flex-direction: column;
        overflow-x: hidden;
        place-items: center;
      }
      body.scrollingDisabled { overflow: hidden; }
      .emscripten { padding-right: 0; display: block; }
      div.emscripten { text-align: center; }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        display: none;
        background-color: black;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -o-crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
      canvas.emscripten.active { opacity: 1; }
      #status { display: none; }
      .loading, #message-container { display: none; }

      #utLoader {
        position: fixed; inset: 0; z-index: 9999;
        background: #000;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      #utLoader.hide { display: none; }
      #utLoader svg { display: block; }
      #utPct {
        margin-top: 34px;
        font-family: 'Press Start 2P', monospace;
        font-size: 18px; color: #fff;
        letter-spacing: 0.06em;
      }
      #utStage {
        margin-top: 18px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px; color: #6e6e6e;
        letter-spacing: 0.28em; text-transform: uppercase;
        min-height: 10px;
      }
      #utStage.err { color: #ff0000; letter-spacing: 0.14em; }
      #utLoader.done #utHeartFill { animation: utFlash 0.32s steps(2, jump-none) 1; }
      @keyframes utFlash { 0% { fill: #fff; } 100% { fill: #ff0000; } }
      #utWarn {
        position: absolute; top: 14px; left: 0; right: 0;
        text-align: center; padding: 0 16px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px; color: #e0b400; line-height: 1.9;
      }
      #utRetry {
        margin-top: 30px;
        font-family: 'Press Start 2P', monospace;
        font-size: 11px; color: #ff9c00;
        background: #000;
        border: 2px solid #ff9c00;
        padding: 12px 34px; cursor: pointer;
      }
      #utRetry:hover, #utRetry:focus-visible { background: #ff9c00; color: #000; }
      .ut-bottom {
        position: absolute; bottom: 14px; left: 0; right: 0;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px;
        padding: 0 18px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px; color: #4a4a4a; letter-spacing: 0.12em;
      }
      .ut-bottom a { color: #4a4a4a; text-decoration: none; }
      .ut-bottom a:hover, .ut-bottom a:focus-visible { color: #9e9e9e; }
      @media (max-width: 480px) {
        #utPct { font-size: 15px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #utLoader.done #utHeartFill { animation: none; }
      }

      /* paused engine (the pause menu overlays it) */
      canvas.paused { filter: blur(2px) grayscale(1); }
      canvas.unpaused { filter: none; }
      #utPauseMenu { display: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>


    <!-- legacy elements kept for the GameMaker loader (index.js) - kept hidden -->
    <div class="loading" id="legacyLoading" hidden>
      <div class="spinner" id="spinner" hidden></div>
      <div class="emscripten" id="status"></div>
      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <div id="message-container">
      <div id="messages"></div>
    </div>
    <div id="output-container" hidden>
      <textarea id="output" rows="8"></textarea>
    </div>

    <!-- ============ loading screen ============ -->
    <div id="utLoader">
      <div id="utWarn" hidden></div>
      <svg id="utHeart" viewBox="0 0 11 10" width="33" height="30" shape-rendering="crispEdges" aria-hidden="true">
        <defs>
          <clipPath id="utHeartClip">
            <rect x="2" y="0" width="2" height="1"/><rect x="7" y="0" width="2" height="1"/>
            <rect x="1" y="1" width="4" height="1"/><rect x="6" y="1" width="4" height="1"/>
            <rect x="0" y="2" width="11" height="3"/>
            <rect x="1" y="5" width="9" height="1"/><rect x="2" y="6" width="7" height="1"/>
            <rect x="3" y="7" width="5" height="1"/><rect x="4" y="8" width="3" height="1"/>
            <rect x="5" y="9" width="1" height="1"/>
          </clipPath>
        </defs>
        <g fill="#3a0508">
          <rect x="2" y="0" width="2" height="1"/><rect x="7" y="0" width="2" height="1"/>
          <rect x="1" y="1" width="4" height="1"/><rect x="6" y="1" width="4" height="1"/>
          <rect x="0" y="2" width="11" height="3"/>
          <rect x="1" y="5" width="9" height="1"/><rect x="2" y="6" width="7" height="1"/>
          <rect x="3" y="7" width="5" height="1"/><rect x="4" y="8" width="3" height="1"/>
          <rect x="5" y="9" width="1" height="1"/>
        </g>
        <g clip-path="url(#utHeartClip)">
          <rect id="utHeartFill" x="0" y="10" width="11" height="10" fill="#FF0000"/>
        </g>
      </svg>
      <div id="utPct">0%</div>
      <div id="utStage">LOADING</div>
      <button id="utRetry" type="button" hidden>RETRY</button>
      <div class="ut-bottom">
        <span>port by Kantasu</span>
        <span>v1.3</span>
        <a id="utOfflineLink" href="https://github.com/ddown325/Undertale-HTML/releases/latest/download/UNDERTALE-offline.html" target="_blank" rel="noopener">offline version</a>
      </div>
    </div>

    <script src="savesync.js"></script>
    <script>
    (function () {
      'use strict';

      /* ==========================================================
       *  CONFIG - bump CACHE_VERSION whenever you update any game
       *  file (game.unx parts, runner.*, lang/*) so every visitor
       *  re-downloads instead of using their stale offline copy.
       * ========================================================== */
      var CACHE_VERSION = 'v1.3';
      var CACHE_NAME = 'undertale-html-' + CACHE_VERSION;

      /* exact byte sizes - used for progress when a response has no
       * Content-Length, and to detect stale cached copies */
      var SIZES = {
        'game.unx.part1': 19993648,
        'game.unx.part2': 19993648,
        'game.unx.part3': 19993648,
        'game.unx.part4': 19993648,
        'game.unx.part5': 20002092,
        'runner.wasm': 5645898,
        'runner.data': 12561615,
        'audio-worklet.js': 491,
        'lang/lang_en.json': 1120879,
        'lang/lang_ja.json': 1576330
      };
      var PARTS = ['game.unx.part1', 'game.unx.part2', 'game.unx.part3', 'game.unx.part4', 'game.unx.part5'];
      var RUNTIME = ['runner.wasm', 'runner.data', 'audio-worklet.js', 'lang/lang_en.json', 'lang/lang_ja.json'];
      var TOTAL_BYTES = 120881897;

      var el = {
        loader: document.getElementById('utLoader'),
        warn: document.getElementById('utWarn'),
        stage: document.getElementById('utStage'),
        pct: document.getElementById('utPct'),
        heartFill: document.getElementById('utHeartFill'),
        retry: document.getElementById('utRetry'),
        status: document.getElementById('status')
      };

      /* ---------------- progress ---------------- */
      var received = {};    /* file -> bytes confirmed */

      function totalReceived() {
        var t = 0;
        for (var k in received) t += received[k];
        return t;
      }

      var complete = false;

      function updateUI(stageText) {
        var done = totalReceived();
        var frac = Math.max(0, Math.min(1, done / TOTAL_BYTES));
        el.heartFill.setAttribute('y', String(10 - 10 * frac));
        el.pct.textContent = Math.floor(frac * 100) + '%';
        if (frac >= 0.999 && !complete) {
          complete = true;
          el.loader.classList.add('done');
        }
        if (stageText) el.stage.textContent = stageText;
      }
      updateUI();

      function fail(msg) {
        el.stage.textContent = msg;
        el.stage.classList.add('err');
        el.retry.hidden = false;
      }
      el.retry.addEventListener('click', function () { location.reload(); });

      /* ---------------- fetch one file (cache -> network w/ progress -> cache) ---------------- */
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      function readWithProgress(resp, name, onBytes) {
        if (!resp.body || typeof resp.body.getReader !== 'function') {
          return resp.arrayBuffer().then(function (buf) {
            onBytes(buf.byteLength);
            return buf;
          });
        }
        var reader = resp.body.getReader();
        var chunks = [], got = 0;
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) {
              var out = new Uint8Array(got), o = 0;
              for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
              return out.buffer;
            }
            chunks.push(r.value);
            got += r.value.length;
            onBytes(got);
            return pump();
          });
        }
        return pump();
      }

      async function fetchFile(name, attempt) {
        attempt = attempt || 0;
        var url = new URL(name, document.baseURI).href;

        /* 1. page-level Cache API read (works even before the SW controls us) */
        try {
          var hit = await caches.match(url);
          if (hit) {
            var cl = +(hit.headers.get('Content-Length') || 0);
            var expected = SIZES[name] || 0;
            if (!expected || !cl || cl === expected) {
              var buf = await hit.arrayBuffer();
              received[name] = buf.byteLength;
              updateUI();
              return new Uint8Array(buf);
            }
            /* stale size -> fall through and re-download */
          }
        } catch (e) { /* storage unavailable - just stream */ }

        /* 2. network download with live progress */
        try {
          var resp = await fetch(url, { cache: 'default', credentials: 'same-origin' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status + ' for ' + name);
          var cloneForCache = null;
          try { cloneForCache = resp.clone(); } catch (e) {}
          var data = new Uint8Array(await readWithProgress(resp, name, function (n) {
            received[name] = n;
            updateUI();
          }));
          /* 3. store for instant + offline repeat visits */
          if (cloneForCache) {
            try {
              var cache = await caches.open(CACHE_NAME);
              await cache.put(url, cloneForCache);
            } catch (e) { /* private mode etc. - fine */ }
          }
          return data;
        } catch (err) {
          if (attempt < 2) {
            console.warn('[loader] retrying', name, err && err.message);
            await sleep(700 * (attempt + 1));
            return fetchFile(name, attempt + 1);
          }
          throw err;
        }
      }

      /* ---------------- merge the game data ---------------- */
      function mergeParts(buffers) {
        var total = 0, i;
        for (i = 0; i < buffers.length; i++) total += buffers[i].length;
        var merged = new Uint8Array(total), off = 0;
        for (i = 0; i < buffers.length; i++) { merged.set(buffers[i], off); off += buffers[i].length; }
        return merged;
      }

      /* ---------------- runner boot ---------------- */
      var VFS = {}; /* filename -> blob URL served to the GameMaker runtime */

      function installInterceptors() {
        var swap = function (url) {
          if (typeof url !== 'string') return url;
          for (var name in VFS) {
            if (url.indexOf(name) >= 0) return VFS[name];
          }
          return url;
        };
        var originalFetch = window.fetch;
        window.fetch = async function () {
          var a = arguments;
          if (typeof a[0] === 'string') {
            return originalFetch.call(this, swap(a[0]), a[1]);
          }
          if (a[0] && a[0] instanceof Request) {
            var swapped = swap(a[0].url);
            if (swapped !== a[0].url) return originalFetch.call(this, new Request(swapped, a[0]), a[1]);
          }
          return originalFetch.apply(this, a);
        };
        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          var rest = Array.prototype.slice.call(arguments, 2);
          return originalOpen.apply(this, [method, swap(url)].concat(rest));
        };
        /* audio worklet module is fetched by URL too */
        if (window.AudioWorklet && AudioWorklet.prototype) {
          var origAddModule = AudioWorklet.prototype.addModule;
          AudioWorklet.prototype.addModule = function (url, opts) {
            return origAddModule.call(this, swap(url), opts);
          };
        }
      }

      /* clean the GameMaker loader's raw status strings for the stage line */
      var STAGE_MAP = [
        [/download/i, 'LOADING ENGINE'],
        [/compil/i, 'LOADING ENGINE'],
        [/initialis|initializ/i, 'STARTING GAME'],
        [/prepare/i, 'STARTING GAME'],
        [/start|run/i, 'STARTING GAME']
      ];
      function translateGM(t) {
        t = String(t).replace(/[\s.]*\d+%\s*$/, '').replace(/\.+$/, '').trim();
        for (var i = 0; i < STAGE_MAP.length; i++) {
          if (STAGE_MAP[i][0].test(t)) return STAGE_MAP[i][1];
        }
        return t.toUpperCase().slice(0, 24);
      }

      function startRunnerScripts() {
        /* mirror the hidden GameMaker status into the stage line while it boots */
        var mirror = setInterval(function () {
          var t = el.status && el.status.textContent ? el.status.textContent.trim() : '';
          if (t) el.stage.textContent = translateGM(t);
        }, 300);

        var hide = function () {
          if (el.loader.classList.contains('hide')) return;
          clearInterval(mirror);
          el.loader.classList.add('hide');
        };
        /* hide as soon as the game prints its first frame */
        var origLog = console.log.bind(console);
        console.log = function (t) {
          if (typeof t === 'string' && t.indexOf('Entering main loop') >= 0) {
            console.log = origLog;
            hide();
          }
          origLog.apply(console, arguments);
        };
        /* belt and braces: the canvas gets .active at the same moment */
        var poll = setInterval(function () {
          if (document.getElementById('canvas').classList.contains('active')) {
            clearInterval(poll); hide();
          }
        }, 500);

        el.stage.textContent = 'STARTING GAME';
        updateUI('STARTING GAME');
        el.pct.textContent = '100%';

        var s1 = document.createElement('script');
        s1.src = 'index.js';
        s1.onerror = function () { fail('COULD NOT LOAD INDEX.JS'); };
        document.body.appendChild(s1);
        var s2 = document.createElement('script');
        s2.src = 'runner.js';
        s2.onerror = function () { fail('COULD NOT LOAD RUNNER.JS'); };
        document.body.appendChild(s2);
      }

      /* ---------------- service worker (oggs + offline shell) ---------------- */
      function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('[loader] service worker unavailable:', e);
        });
      }

      /* ---------------- main ---------------- */
      async function main() {
        registerSW();
        try {
          /* all downloads in parallel - progress is byte-exact across them */
          var names = PARTS.concat(RUNTIME);
          updateUI('LOADING GAME DATA');
          var results = {};
          var jobs = names.map(function (n) {
            return fetchFile(n).then(function (data) { results[n] = data; });
          });
          await Promise.all(jobs);

          var gameData = mergeParts(PARTS.map(function (p) { return results[p]; }));

          /* build the in-memory file system the runtime will be pointed at */
          VFS['game.unx'] = URL.createObjectURL(new Blob([gameData]));
          VFS['runner.wasm'] = URL.createObjectURL(new Blob([results['runner.wasm']], { type: 'application/wasm' }));
          VFS['runner.data'] = URL.createObjectURL(new Blob([results['runner.data']], { type: 'application/octet-stream' }));
          VFS['audio-worklet.js'] = URL.createObjectURL(new Blob([results['audio-worklet.js']], { type: 'text/javascript' }));
          VFS['lang_en.json'] = URL.createObjectURL(new Blob([results['lang/lang_en.json']], { type: 'application/json' }));
          VFS['lang_ja.json'] = URL.createObjectURL(new Blob([results['lang/lang_ja.json']], { type: 'application/json' }));

          /* clean caches from older versions once we're done with them */
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { if (k !== CACHE_NAME) caches.delete(k); });
          }).catch(function () {});

          installInterceptors();
          startRunnerScripts();
        } catch (err) {
          console.error(err);
          fail('DOWNLOAD FAILED');
          el.warn.hidden = false;
          el.warn.textContent = 'CHECK YOUR CONNECTION, THEN RETRY.';
        }
      }

      window.addEventListener('error', function () {
        if (!el.loader.classList.contains('hide') && el.retry.hidden) {
          el.warn.hidden = false;
          el.warn.textContent = 'SOMETHING WENT WRONG - DETAILS IN THE CONSOLE (F12).';
        }
      });

      if ('storage' in navigator && navigator.storage && navigator.storage.estimate) {
        navigator.storage.estimate().then(function (est) {
          /* ~250 MB headroom needed for the game + cache; warn early if clearly impossible */
          if (est.quota && est.quota < 250 * 1048576) {
            el.warn.hidden = false;
            el.warn.textContent = 'BROWSER STORAGE IS LOW - THE OFFLINE CACHE MAY NOT FIT.';
          }
        }).catch(function () {});
      }

      main();
    })();
    </script>
  </body>
</html>
